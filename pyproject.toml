[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "lab18-apache-ossie-two-clouds"
version = "0.1.0"
description = "One Semantic YAML, Multiple Cloud Platforms: Apache Ossie -> Snowflake Semantic View / HTTP MCP + Power BI .pbit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "snowflake-connector-python>=3.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
ossie-lab18 = "src.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
